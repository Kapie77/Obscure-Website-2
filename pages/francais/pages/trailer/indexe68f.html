         document.player.Volume = 0;

function voldown() {
   currentVolume = document.player.Volume;
   newVolume = (currentVolume - 2000);

   if (document.player.Volume == -10000) {
      alert("Volume is already at minimum");
   }
   if (newVolume >= -8000) {
      document.player.Volume = newVolume;
   }
   else {

         document.player.Volume = -10000;

   }
